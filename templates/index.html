<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }
        textarea:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .chat-box {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .user-msg {
            background-color: #e3f2fd;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #0d47a1;
        }
        .ai-msg {
            background-color: #f1f1f1;
            padding: 15px;
            border-radius: 8px;
            color: #212121;
            white-space: pre-wrap;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2> Groq AI Assistant</h2>
    
    <form action="/" method="POST">
        <textarea name="user_message" placeholder="এখানে তোমার প্রশ্ন লেখো..." required>{{ prompt if prompt }}</textarea>
        <button type="submit">পাঠিয়ে দাও</button>
    </form>

    {% if response %}
        <div class="chat-box">
            <div class="user-msg">
                <strong>তুমি:</strong> {{ prompt }}
            </div>
            <div class="ai-msg">
                <strong>AI:</strong><br>
                {{ response }}
            </div>
        </div>
    {% endif %}
</div>

</body>
</html>
