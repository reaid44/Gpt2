<!-- index.html -->
<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bengali Chatbot</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--text:#e6eef8}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:linear-gradient(180deg,#071025 0%,#071730 100%);color:var(--text);display:flex;align-items:center;justify-content:center;height:100vh}
    .container{width:100%;max-width:820px;padding:20px;border-radius:12px;background:rgba(255,255,255,0.03);box-shadow:0 6px 24px rgba(2,6,23,0.6)}
    header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .logo{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:700;color:#032;box-shadow:0 4px 14px rgba(6,182,212,0.12)}
    h1{font-size:18px;margin:0}
    p.lead{margin:4px 0 16px;color:rgba(230,238,248,0.8);font-size:13px}
    .chatbox{height:440px;background:var(--card);border-radius:10px;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
    .msg{max-width:78%;padding:10px 12px;border-radius:10px;line-height:1.4}
    .user{align-self:flex-end;background:linear-gradient(90deg,#0ea5a4,#06b6d4);color:#012;border-bottom-right-radius:4px}
    .bot{align-self:flex-start;background:rgba(255,255,255,0.04);color:var(--text);border-bottom-left-radius:4px}
    .controls{display:flex;gap:8px;margin-top:12px}
    textarea#input{flex:1;min-height:56px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text);padding:10px;resize:none}
    button{background:var(--accent);color:#012;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
    button:disabled{opacity:0.6;cursor:not-allowed}
    .meta{font-size:12px;color:rgba(230,238,248,0.65);margin-top:8px;text-align:right}
    @media (max-width:520px){.container{padding:12px}.chatbox{height:360px}}
  </style>
</head>
<body>
  <div class="container" role="main">
    <header>
      <div class="logo">BC</div>
      <div>
        <h1>Bengali Chatbot</h1>
        <p class="lead">DistilGPT2 fallback demo. বাংলায় লিখো, বট উত্তর দেবে.</p>
      </div>
    </header>

    <main>
      <div id="chat" class="chatbox" aria-live="polite"></div>

      <div class="controls" style="margin-top:12px">
        <textarea id="input" placeholder="এখানে বাংলা লিখে Send চাপুন"></textarea>
        <button id="send">Send</button>
      </div>

      <div class="meta">Local demo. For production point frontend to your backend /generate endpoint.</div>
    </main>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function appendMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + (who === 'user' ? 'user' : 'bot');
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      appendMessage(text, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;
      appendMessage('লিখছে...', 'bot');

      try {
        // Adjust URL to your backend. Example assumes POST /generate with JSON {input}
        const res = await fetch('/generate', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({input: text})
        });

        // Remove the temporary 'লিখছে...' message
        const temps = Array.from(chatEl.querySelectorAll('.bot')).filter(n => n.textContent === 'লিখছে...');
        if (temps.length) temps[temps.length-1].remove();

        if (!res.ok) {
          appendMessage('সার্ভার ত্রুটি: ' + res.status, 'bot');
        } else {
          const data = await res.json();
          // Expect backend response like { reply: "..." }
          appendMessage(data.reply || 'কিছু পাওয়া যায়নি', 'bot');
        }
      } catch (err) {
        // Remove temp
        const temps = Array.from(chatEl.querySelectorAll('.bot')).filter(n => n.textContent === 'লিখছে...');
        if (temps.length) temps[temps.length-1].remove();
        appendMessage('কনেকশন ত্রুটি', 'bot');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Sample welcome message
    appendMessage('স্বাগতম! কি সহায়তা লাগবে?', 'bot');
  </script>
</body>
</html>
